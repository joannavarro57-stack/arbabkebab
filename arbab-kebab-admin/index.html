<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Arbab Kebab · Orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23E0701C' stroke='%231E1A16' stroke-width='5'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Georgia' font-weight='700' font-size='24' fill='%231E1A16'%3EAK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://arbabkebab.vercel.app/config.js"></script>  <!-- website settings: shared branch list -->
<style>
:root{
  --saffron:#F5B21B; --saffron-soft:#FCE7AE; --ember:#E0701C; --ember-dark:#B9530C;
  --char:#1E1A16; --char-2:#3A322B; --muted:#7A6D5F; --line:#E7DCC7; --bg:#F6F1E7; --card:#FFFDF8;
  --red:#C2410C; --blue:#1D5FBF; --amber:#B7791F; --teal:#0F7C78; --purple:#6B46C1; --green:#2F7D4F; --grey:#7A7368;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--char);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mark{width:34px;height:34px;flex:none;border-radius:50%;background:var(--ember);border:3px solid var(--char);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:800;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--char-2)}
.btn.dark{background:var(--char);border-color:var(--char);color:#fff}
.btn.ember{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.ember:hover{background:var(--ember-dark)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ember)}
.delete-dialog{width:min(440px,calc(100% - 32px));border:2px solid var(--char);border-radius:16px;padding:22px;background:var(--card);color:var(--char);box-shadow:0 18px 60px rgba(0,0,0,.3)}
.delete-dialog::backdrop{background:rgba(30,26,22,.58)}
.delete-dialog h2{margin:0 0 6px;font-size:20px}
.delete-dialog p{margin:0 0 12px;color:var(--muted)}
.delete-dialog label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
.delete-dialog input,.delete-dialog textarea{width:100%}
.delete-dialog .msg{min-height:1.3em;color:var(--red);font-size:13px;margin:10px 0 0}
.delete-dialog .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.order-edit-dialog{width:min(820px,calc(100% - 24px));max-height:min(90vh,900px);overflow:auto;border:2px solid var(--char);border-radius:16px;padding:0;background:var(--card);color:var(--char);box-shadow:0 18px 60px rgba(0,0,0,.3)}
.order-edit-dialog::backdrop{background:rgba(30,26,22,.58)}
.edit-head,.edit-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;background:var(--card)}
.edit-head{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
.edit-head h2{margin:0;font-size:20px}
.edit-foot{position:sticky;bottom:0;border-top:1px solid var(--line);justify-content:flex-end}
.edit-body{padding:14px 18px}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.edit-field{display:grid;gap:4px;font-size:13px;font-weight:700}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;min-width:0}
.edit-field.wide{grid-column:1/-1}
.edit-items{display:grid;gap:8px;margin-top:10px}
.edit-item,.edit-item-head{display:grid;grid-template-columns:minmax(140px,2fr) minmax(90px,.7fr) minmax(100px,.8fr) minmax(120px,1.2fr) 34px;gap:7px;align-items:center}
.edit-item input,.edit-item select{width:100%;min-width:0}
.edit-item .remove{width:34px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--red)}
.edit-total{font-weight:800;text-align:right;margin-top:10px}
.edit-msg{min-height:1.3em;color:var(--red);font-size:13px;margin-top:8px}
@media(max-width:620px){
  .edit-grid{grid-template-columns:1fr}
  .edit-field.wide{grid-column:auto}
  .edit-item,.edit-item-head{grid-template-columns:minmax(0,1fr) 72px 92px 34px}
  .edit-item .edit-options{grid-column:1/4;grid-row:2}
}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--saffron)}
.login form{width:min(380px,100%);background:var(--card);border:3px solid var(--char);border-radius:20px;padding:28px 22px;box-shadow:8px 8px 0 var(--char)}
.login h1{font-family:Fraunces,serif;font-size:28px;margin:12px 0 2px}
.login p{color:var(--muted);margin:0 0 18px}
.login label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.login input{width:100%;padding:11px 12px}
.login .btn{width:100%;margin-top:18px;padding:12px}
.login .msg{min-height:1.2em;font-size:13px;margin-top:10px;color:var(--red)}
.login .msg.ok{color:var(--green)}
.login .link{background:none;border:0;color:var(--ember-dark);font-weight:600;padding:8px 0 0;text-decoration:underline}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:var(--char);color:#fff}
.top .in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1400px;margin:0 auto}
.top h1{font-size:17px;margin:0;font-weight:800}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#cfc4b3;margin-left:4px}
.live i{width:8px;height:8px;border-radius:50%;background:#6b6258}
.live.on i{background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.top .sp{flex:1}
.top .btn{background:transparent;border-color:#4a4038;color:#fff}
.top .who{font-size:12px;color:#cfc4b3;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1 1 200px;min-width:160px}
.date-range{position:relative}
.date-range-trigger{min-width:230px;text-align:left}
.calendar-popover{position:absolute;top:calc(100% + 6px);left:0;z-index:15;width:300px;padding:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(30,26,22,.18)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calendar-head strong{font-size:14px}
.calendar-nav{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:18px}
.calendar-weekdays,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calendar-weekdays{margin-bottom:4px;color:var(--muted);font-size:11px;font-weight:700}
.calendar-day,.calendar-empty{display:grid;place-items:center;min-width:0;height:34px}
.calendar-day{border:0;border-radius:8px;background:transparent;font-size:13px}
.calendar-day:hover{background:var(--saffron-soft)}
.calendar-day.selected{background:var(--ember);color:#fff;font-weight:800}
.calendar-day.in-range{background:var(--saffron-soft);border-radius:0}
.calendar-day.range-start{border-radius:8px 0 0 8px}
.calendar-day.range-end{border-radius:0 8px 8px 0}
.calendar-instruction{margin:9px 0 0;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.tab b{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--bg);font-size:12px}
.tab.on{background:var(--char);border-color:var(--char);color:#fff}
.tab.on b{background:var(--saffron);color:var(--char)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
.list{display:grid;gap:8px}
.order{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-left-width:6px;border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.order:hover{border-color:var(--char-2)}
.order.sel{border-color:var(--char);box-shadow:0 0 0 2px var(--char) inset}
.order.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{background:var(--saffron-soft)}}
.order .no{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.order .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .meta{grid-column:2/4;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .tot{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.order .ago{grid-column:1;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.pay{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pay.unpaid{color:var(--grey)} .pay.submitted{color:#fff;background:var(--amber);border-color:var(--amber)} .pay.paid{color:var(--green)} .pay.refunded{color:var(--purple)}
.paybox{border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--bg)}
.paybox.submitted{background:#FFF3D6;border:1.5px solid var(--amber)}
.paybox .big{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;letter-spacing:.04em}
.pay-proof img{display:block;width:min(100%,420px);max-height:480px;object-fit:contain;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.empty{padding:50px 16px;text-align:center;color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:14px}

/* detail */
.detail{position:sticky;top:70px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;max-height:calc(100vh - 84px);overflow:auto}
.detail .placeholder{padding:60px 20px;text-align:center;color:var(--muted)}
.d-h{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.d-h h2{margin:0;font-size:22px;font-weight:800}
.d-h .sub{color:var(--muted);font-size:13px}
.d-h .x{margin-left:auto;display:none}
.d-status-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--red)}
.icon-btn:hover{border-color:var(--red);background:#FEF2F2}
.icon-btn svg{width:15px;height:15px}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.row-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row-btns.one-line{flex-wrap:nowrap}
.row-btns.one-line .btn{flex:1 1 auto;min-width:0;padding:6px 8px;font-size:12.5px;gap:4px;overflow:hidden}
table.items{width:100%;border-collapse:collapse;font-size:14px}
table.items td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
table.items td.q{width:36px;font-weight:800}
table.items td.p{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
table.items .o{color:var(--muted);font-size:12.5px}
.sum{display:grid;gap:6px;margin-top:10px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;align-items:center}
.sum .grand{font-size:20px;font-weight:800;border-top:2px solid var(--char);padding-top:8px}
.driver-fee{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:700}
.driver-fee input{width:120px;text-align:right;font-weight:700}
.driver-msg{margin:0;padding:10px 12px;background:#fff;border:1.5px solid var(--line);border-radius:10px;font:13px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.driver-copy{width:100%;margin-top:8px}
.driver-hint{margin:6px 0 0;font-size:12px;color:var(--muted);text-align:center}
.note-box{background:var(--saffron-soft);border-radius:10px;padding:8px 10px;font-size:14px}
textarea{width:100%;resize:vertical}
.actions{padding:14px 16px;display:grid;gap:8px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
.actions .btn.ember{padding:12px;font-size:16px}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved{font-size:12px;color:var(--green);margin-left:6px}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--char);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.toast.new{background:var(--ember)}

@media(max-width:1000px){
  .main{grid-template-columns:1fr}
  .detail{position:fixed;inset:0;top:0;z-index:40;border-radius:0;max-height:none;display:none}
  .detail.open{display:block}
  .d-h .x{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .top .who{display:none}
}

/* print a kitchen ticket */
@media print{
  body{background:#fff;font-size:13px}
  .top,.toolbar,.kpis,.tabs,.list,.actions,.d-h .x,.no-print,.toast{display:none!important}
  .main{display:block}
  .detail{position:static;display:block!important;border:0;max-height:none;overflow:visible}
  input{border:0;padding:0}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <span class="mark" style="width:48px;height:48px;font-size:15px">AK</span>
    <h1>Arbab Kebab</h1>
    <p>Staff login · Orders</p>
    <div id="loginFields">
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn dark" type="submit" id="loginBtn">Log in</button>
      <button class="link" type="button" id="forgot">Forgot password?</button>
    </div>
    <div id="resetFields" hidden>
      <label for="pw1">New password</label><input id="pw1" type="password" autocomplete="new-password" minlength="8">
      <button class="btn dark" type="button" id="setPw">Save new password</button>
    </div>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</section>

<!-- ================= APP ================= -->
<div id="appView" hidden>
  <header class="top">
    <div class="in">
      <span class="mark">AK</span>
      <h1>Orders</h1>
      <span class="live" id="live" title="Live updates"><i></i><span id="liveTxt">connecting</span></span>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <a class="btn sm" href="https://arbabkebab.vercel.app/" target="_blank" rel="noopener" title="Open the customer order site">🌐 Site</a>
      <button class="btn sm" id="soundBtn" aria-pressed="true">🔔 Sound on</button>
      <button class="btn sm" id="logout">Log out</button>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="date-range">
        <button class="btn date-range-trigger" id="dateRangeBtn" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
        <section class="calendar-popover" id="dateRangeCalendar" role="dialog" aria-label="Choose order date range" hidden>
          <div class="calendar-head">
            <button class="calendar-nav" id="calendarPrev" type="button" aria-label="Previous month">‹</button>
            <strong id="calendarMonth"></strong>
            <button class="calendar-nav" id="calendarNext" type="button" aria-label="Next month">›</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div>
          <div class="calendar-days" id="calendarDays" role="grid" aria-label="Calendar dates"></div>
          <p class="calendar-instruction" id="calendarInstruction" aria-live="polite"></p>
        </section>
      </div>
      <input id="rangeFrom" type="hidden">
      <input id="rangeTo" type="hidden">
      <select id="branchF" aria-label="Branch"></select>
      <input class="search" id="q" type="search" placeholder="Search name, phone, ref…" aria-label="Search orders">
      <button class="btn" id="refresh" title="Reload">↻ Refresh</button>
      <button class="btn ember" id="addOrder">＋ Add order</button>
      <button class="btn" id="csv">⬇ Export CSV</button>
    </div>

    <div class="kpis" id="kpis"></div>
    <nav class="tabs" id="tabs" aria-label="Order status"></nav>

    <div class="main">
      <div class="list" id="list"></div>
      <aside class="detail" id="detail" aria-label="Order details"><div class="placeholder">Select an order to see details.</div></aside>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="delete-dialog" id="deleteDialog" aria-labelledby="deleteTitle">
  <form id="deleteForm">
    <h2 id="deleteTitle">Delete order?</h2>
    <p id="deleteContext">The order will be removed from active views. Its database record will be retained.</p>
    <label for="deleteReason">Reason for deletion</label>
    <textarea id="deleteReason" rows="3" maxlength="500" required></textarea>
    <label for="deletePassword">Staff account password</label>
    <input id="deletePassword" type="password" autocomplete="current-password" required>
    <p class="msg" id="deleteMsg" role="alert"></p>
    <div class="buttons">
      <button class="btn" type="button" id="deleteCancel">Keep order</button>
      <button class="btn danger" type="submit" id="deleteConfirm">Delete order</button>
    </div>
  </form>
</dialog>
<dialog class="order-edit-dialog" id="orderEditDialog" aria-labelledby="orderEditTitle">
  <form id="orderEditForm">
    <div class="edit-head"><h2 id="orderEditTitle">Edit order</h2><button class="btn sm" type="button" id="orderEditClose" aria-label="Close">✕</button></div>
    <div class="edit-body">
      <div class="edit-grid" id="orderEditFields"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px">
        <h3 style="font-size:14px;margin:0">Items</h3><button class="btn sm" type="button" id="addOrderItem">＋ Add item</button>
      </div>
      <div class="edit-item-head" style="margin-top:8px;font-size:12px;color:var(--muted);font-weight:700"><span>Product</span><span>Qty</span><span>Unit price</span><span>Options</span><span></span></div>
      <div class="edit-items" id="orderEditItems"></div>
      <div class="edit-total" id="orderEditTotal"></div>
      <div class="edit-msg" id="orderEditMsg" role="alert"></div>
    </div>
    <div class="edit-foot"><button class="btn" type="button" id="orderEditCancel">Cancel</button><button class="btn dark" id="orderEditSave" type="submit">Save order</button></div>
  </form>
</dialog>

<script>
/* ================= CONFIG (edit me) ================= */
const CONFIG = {
  supabaseUrl: "https://addfbbpqhxsinedvnnme.supabase.co",      // Supabase → Project Settings → API → Project URL
  supabaseKey: "sb_publishable_vNys_OaZ_iVP1bfJj64Qhw_QQvyEaQp",      // the anon / publishable key (same one as the order site)
  orderSiteUrl: "https://arbabkebab.vercel.app",    // customer site address — used for GCash payment links
  businessName: "Arbab Kebab",
  branches: ["San Mateo", "Malolos"],   // admin-only extras; the main list is the website's config.js
  timeZone: "Asia/Manila",
  currency: "₱"

function startOfLocalDay(daysAgo=0){ const d = new Date(Date.now() - daysAgo*864e5); return new Date(ymdLocal(d) + "T00:00:00+08:00"); }
function ago(ts){
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if(m < 1) return "just now"; if(m < 60) return m + " min ago";
  const d = new Date(ts); return (ymdLocal(d) === ymdLocal(new Date()) ? "" : fmtDate.format(d) + " · ") + fmtTime.format(d);

/* ================= DATA ================= */
function rangeBounds(){
  const fromValue = $("#rangeFrom").value, toValue = $("#rangeTo").value;
  if(!fromValue || !toValue || fromValue > toValue) return null;
  const from = new Date(fromValue + "T00:00:00+08:00");
  const to = new Date(toValue + "T00:00:00+08:00");
  to.setUTCDate(to.getUTCDate() + 1);
  return [from, to];
}
async function load(){
  const bounds = rangeBounds();
  if(!bounds){ orders = []; render(); toast("Choose a valid start and end date."); return false; }
  const [from, to] = bounds;
  let q = sb.from("orders").select("*").gte("created_at", from.toISOString()).order("created_at", {ascending:false}).limit(1000);
  q = q.lt("created_at", to.toISOString());
  const { data, error } = await q;
  if(error){ toast("Couldn't load orders: " + error.message); return false; }
  orders = data; render(); return true;
}
function inRange(o){
  const bounds = rangeBounds();
  if(!bounds) return false;
  const [from,to] = bounds, t = new Date(o.created_at);
  return t >= from && t < to;
}
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("orders-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"orders"}, ({eventType, new: row}) => {
      if(!row || !row.id) return;
      const i = orders.findIndex(o => o.id === row.id);
      if(eventType === "INSERT" && i < 0){
        if(inRange(row)) orders.unshift(row);
        if(!row.deleted_at && !isPendingGcash(row) && (!$("#branchF").value || $("#branchF").value === row.branch)){
          beep(); toast(`New order ${row.ref} · ${row.customer_name} · ${peso(row.total)}`, true);
          flashId = row.id;
        }
      } else if(i >= 0){
        const before = orders[i];
        if(row.payment_status === "submitted" && before.payment_status !== "submitted" &&
           (!$("#branchF").value || $("#branchF").value === row.branch)){
          beep(); toast(`💸 GCash payment to verify · #${row.order_no} · ${peso(row.total)}`, true); flashId = row.id;
        }
        orders[i] = row;
      }
      else if(inRange(row)) orders.unshift(row);
      render();
    })
    .subscribe(status => {
      const on = status === "SUBSCRIBED";
      $("#live").classList.toggle("on", on); $("#liveTxt").textContent = on ? "live" : "reconnecting";
      if(on) load();
    });
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && sb && !$("#appView").hidden) load(); });

async function updateOrder(id, patch, msg){
  const { data, error } = await sb.from("orders").update(patch).eq("id", id).select().single();
  if(error){ toast("Couldn't save: " + error.message); return false; }
  const i = orders.findIndex(o => o.id === id); if(i >= 0) orders[i] = data;
  render(); if(msg) toast(msg); return true;
}

  const b = $("#branchF").value, q = $("#q").value.trim().toLowerCase();
  return orders.filter(o => inRange(o) && !o.deleted_at && !isPendingGcash(o) && matchesOrderFilters(o, b, q));
}
function matchesOrderFilters(o, b, q){
  return (!b || o.branch === b) &&
    (!q || [o.ref, o.order_no, o.customer_name, o.customer_phone, o.customer_email, o.address].join(" ").toLowerCase().includes(q));
}
function isPendingGcash(o){ return isGcash(o) && (o.payment_status || "unpaid") === "unpaid" && o.status !== "cancelled"; }
function render(){
  const base = filtered();
  // KPIs (cancelled orders excluded from sales)
  const valid = base.filter(o => o.status !== "cancelled");
  const sales = valid.reduce((s,o)=>s + Number(o.total), 0);
  const collected = valid.filter(o => o.payment_status === "paid").reduce((s,o)=>s + Number(isGcash(o) ? o.subtotal : o.total), 0);
  const open = base.filter(o => OPEN.includes(o.status)).length;
  const verify = base.filter(o => o.payment_status === "submitted" && o.status !== "cancelled").length;
  const newCount = base.filter(o => o.status === "new").length;
  $("#kpis").innerHTML = [
    ["Orders", valid.length], ["Sales", peso(sales)], ["Collected", peso(collected)], ["Open now", open]
  ].map(([l,v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  // Browser tab shows the same number as the "New" tab.
  document.title = (newCount ? `(${newCount}) ` : "") + "Arbab Kebab · Orders";
  // tabs
  const counts = {open, verify, all: base.length}; Object.keys(STATUS).forEach(s => counts[s] = base.filter(o=>o.status===s).length);
  const tabDefs = [["open","Open"],["new","New"],["verify","Verify payment"],["confirmed","Confirmed"],["preparing","Preparing"],["ready","Ready"],["out_for_delivery","Out for delivery"],["completed","Completed"],["cancelled","Cancelled"],["all","All"]];
  $("#tabs").innerHTML = tabDefs.map(([k,l]) => `<button class="tab${tab===k?" on":""}" data-tab="${k}">${l}<b>${counts[k]}</b></button>`).join("");
  // list
  const shown = base.filter(o => tab==="all" ? true : tab==="open" ? OPEN.includes(o.status)
    : tab==="verify" ? (o.payment_status==="submitted" && o.status!=="cancelled") : o.status===tab);
  if(tab === "open") shown.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));   // oldest open order first
  $("#list").innerHTML = shown.length ? shown.map(o => {
    const items = o.items.map(i => `${i.qty}× ${i.name}`).join(", ");
    return `<button class="order${o.id===selId?" sel":""}${o.id===flashId?" flash":""}" data-id="${o.id}" style="border-left-color:${STATUS[o.status]?.color}">
      <span class="no">#${o.order_no}</span>

      <span class="meta">${pill(o.status)} ${payBadge(o)} &nbsp;${esc(o.payment||"")} · ${esc(items)}</span>

  flashId = null;
  renderDetail();
}

  $("#copyConfirm").onclick = async () => {

      ``,

      `${delivery ? "🛵 Delivery" : `🏪 Pick-Up at ${o.branch} branch`}${when ? ` · ${when}` : ""}${o.preferred_time ? ` · ${o.preferred_time}` : ""}`,
      ``,
      `👤 ${o.customer_name} · ${o.customer_phone}`,
      ...(delivery && o.address ? [`🏠 ${o.address}`] : []),
      ...(delivery && hasPin ? [`📍 Pinned location: https://www.google.com/maps/search/?api=1&query=${Number(o.delivery_lat)},${Number(o.delivery_lng)}`] : []),
      ``,
      `📦 Items:`,

      ``,

      ...(isGcash(o) && o.payment_status !== "paid" ? [``, `Pay via GCash here 👉 ${payLink(o)}`] : []),
      ``,

    ];

/* Message for the delivery driver: only where, who, when, what's in the bag and what to collect. */
function driverMessage(o){
  const hasPin = o.delivery_lat != null && o.delivery_lng != null;
  const maps = hasPin ? `https://www.google.com/maps/search/?api=1&query=${Number(o.delivery_lat)},${Number(o.delivery_lng)}` : "";
  const fee = Number(o.delivery_fee) || 0;
  // GCash covers the food only; the delivery fee is always collected in cash by the driver.
  const feeText = fee ? `${peso(fee)} - 💵 Collect cash` : `⏳ Pending`;
  const collect = isGcash(o)
    ? [`🍽️ Food - ${peso(o.subtotal)} - ✅ Paid thru GCash`, `🛵 Delivery Fee - ${feeText}`]
    : [`🍽️ Food - ${peso(o.subtotal)} - 💵 Collect cash`, `🛵 Delivery Fee - ${feeText}`,
       ...(fee ? [`💰 Total to collect - ${peso(o.total)}`] : [])];
  const itemCount = o.items.reduce((n, i) => n + Number(i.qty || 0), 0);
  const lines = [
    `🛵 DELIVERY — Order #${o.order_no} (${o.ref})`,
    `📅 ${fmtOrderDate(o.order_date)} · ${o.preferred_time || "ASAP"}`,
    ``,
    `👤 ${o.customer_name}`,
    `📞 ${o.customer_phone}`,
    `🏠 ${o.address || "—"}`,
    hasPin ? `📍 ${maps}` : `📍 No map pin — use the address above`,
    ``,
    `📦 Items (${itemCount}):`,
    ...o.items.map(i => `• ${i.qty}x ${i.name}${i.opts && i.opts.length ? ` (${i.opts.join(", ")})` : ""}`),
    ``,
    ...collect,
    ...(o.notes ? [``, `📝 Customer note: ${o.notes}`] : []),
    ``,
    `🙏 Salamat po! Ingat sa byahe 🛵💨`
  ];
  return lines.join("\n");
}

function orderField(label, id, value, type="text", wide=false, extra=""){
  return `<label class="edit-field${wide?" wide":""}" for="${id}">${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`;
}
function productOptions(item){
  const match = item && ADMIN_PRODUCTS.find(product => product.name === item.name);
  const products = ADMIN_PRODUCTS.map(product =>
    `<option value="${esc(product.id)}"${match && match.id === product.id ? " selected" : ""}>${esc(product.name)} · ${peso(product.price)}</option>`
  ).join("");
  const existing = item && !match
    ? `<option value="__current__" selected>Existing: ${esc(item.name)}</option>`
    : "";
  return `<option value="">Choose product…</option>${existing}${products}`;
}
function orderItemRow(item){
  const match = item && ADMIN_PRODUCTS.find(product => product.name === item.name);
  const options = Array.isArray(item?.opts) ? item.opts.join(", ") : "";
  return `<div class="edit-item" data-existing-name="${esc(item && !match ? item.name : "")}">
    <select class="edit-product" aria-label="Product" required>${productOptions(item)}</select>
    <input class="edit-qty" type="number" min="1" max="99" step="1" value="${item ? Number(item.qty) : 1}" aria-label="Quantity" required>
    <input class="edit-unit" type="number" min="0" max="100000" step="0.01" value="${item ? Number(item.unit) : ""}" aria-label="Unit price" required>
    <input class="edit-options" type="text" value="${esc(options)}" placeholder="Options, comma-separated" aria-label="Options">
    <button class="remove" type="button" aria-label="Remove item" title="Remove item">×</button>
  </div>`;
}
function updateOrderEditorTotal(){
  const subtotal = Array.from(document.querySelectorAll("#orderEditItems .edit-item")).reduce((sum, row) => {
    return sum + Number(row.querySelector(".edit-qty").value || 0) * Number(row.querySelector(".edit-unit").value || 0);
  }, 0);
  const fee = Number($("#editDeliveryFee")?.value || 0);
  $("#orderEditTotal").textContent = `Subtotal ${peso(subtotal)} · Total ${peso(subtotal + fee)}`;

function refreshEditorPayment(selected=""){
  const mode = $("#editMode").value;
  const allowed = mode === "Delivery"
    ? [["Cash on Delivery","Cash on Delivery"],["GCash","GCash"]]
    : [["Cash","Cash"],["GCash","GCash"]];

    `<option value="${value}"${value === selected ? " selected" : ""}>${label}</option>`
  ).join("");

}
function openOrderEditor(order=null){

  editingOrderId = order?.id || null;
  const isNew = !order;

    <label class="edit-field wide" for="editAddress">Delivery address<textarea id="editAddress" rows="2" maxlength="300">${esc(values.address)}</textarea></label>

    <label class="edit-field wide" for="editStaffNotes">Staff notes<textarea id="editStaffNotes" rows="2" maxlength="1000">${esc(values.staffNotes)}</textarea></label>`;

function newOrderReference(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const bytes = crypto.getRandomValues(new Uint8Array(6));
  return "AK-" + Array.from(bytes, byte => chars[byte % chars.length]).join("");
}

$("#orderEditForm").addEventListener("submit", async event => {
  event.preventDefault();
  const message = $("#orderEditMsg");
  const button = $("#orderEditSave");
  const rows = Array.from(document.querySelectorAll("#orderEditItems .edit-item"));
  const items = [];
  for(const row of rows){
    const select = row.querySelector(".edit-product");
    const product = ADMIN_PRODUCTS.find(item => item.id === select.value);
    const name = product?.name || (select.value === "__current__" ? row.dataset.existingName : "");
    const qty = Number(row.querySelector(".edit-qty").value);
    const unit = Number(row.querySelector(".edit-unit").value);
    if(!name || !Number.isInteger(qty) || qty < 1 || qty > 99 || !Number.isFinite(unit) || unit < 0 || unit > 100000){
      message.textContent = "Choose a product and enter a valid quantity and unit price for every line.";
      return;
    }
    items.push({name, opts:row.querySelector(".edit-options").value.split(",").map(value=>value.trim()).filter(Boolean), qty, unit});
  }
  if(items.length < 1 || items.length > 50){ message.textContent = "An order needs between 1 and 50 line items."; return; }
  if($("#editMode").value === "Delivery" && !$("#editAddress").value.trim()){
    message.textContent = "Enter a delivery address.";
    return;
  }
  const payload = {
    ref:editingOrderId ? orders.find(item=>item.id===editingOrderId)?.ref : newOrderReference(),
    mode:$("#editMode").value, branch:$("#editBranch").value,
    name:$("#editName").value.trim(), phone:$("#editPhone").value.trim(), email:$("#editEmail").value.trim(),
    address:$("#editAddress").value.trim(), order_date:$("#editDate").value,
    time:$("#editTime").value.trim(), payment:$("#editPayment").value,
    status:$("#editStatus").value, delivery_fee:$("#editDeliveryFee").value,
    notes:$("#editNotes").value.trim(), staff_notes:$("#editStaffNotes").value.trim(), items
  };
  const isUpdate = Boolean(editingOrderId);
  button.disabled = true;
  message.textContent = "Saving order…";
  try{
    const {data, error} = await sb.rpc("save_staff_order", {p_order_id:editingOrderId, p_order:payload});
    if(error) throw new Error("Couldn't save order: " + error.message);
    if(!data || !data.id) throw new Error("The database did not return the saved order.");
    const index = orders.findIndex(item => item.id === data.id);
    if(index >= 0) orders[index] = data;
    else orders.unshift(data);
    if(!isUpdate) setDateRangeToToday();
    selId = data.id;
    tab = "all";
    $("#orderEditDialog").close();
    render();
    toast(isUpdate ? `Order #${data.order_no} updated` : `Order #${data.order_no} created`);
  }catch(error){
    message.textContent = error.message || "Couldn't save order.";
  }finally{
    button.disabled = false;
  }
});

function openDeleteDialog(order){
  $("#deleteTitle").textContent = `Delete order #${order.order_no}?`;
  $("#deleteContext").textContent = "The order will be removed from active views. Its database record will be retained in Deleted with your reason.";
  $("#deleteMsg").textContent = "";
  $("#deleteReason").value = "";
  $("#deletePassword").value = "";

  $("#deleteDialog").showModal();
  $("#deleteReason").focus();
}

$("#deleteCancel").onclick = () => $("#deleteDialog").close();
$("#deleteDialog").addEventListener("close", () => { $("#deleteForm").reset(); $("#deleteMsg").textContent = ""; });
$("#deleteForm").addEventListener("submit", async event => {
  event.preventDefault();
  const order = orders.find(item => item.id === selId);
  const reason = $("#deleteReason").value.trim();
  const password = $("#deletePassword").value;
  $("#deletePassword").value = "";
  if(!order || order.deleted_at){ $("#deleteMsg").textContent = "This order is no longer available to delete."; return; }
  if(!reason){ $("#deleteMsg").textContent = "Enter a reason before deleting."; return; }
  const button = $("#deleteConfirm");
  button.disabled = true;
  $("#deleteMsg").textContent = "Verifying password…";
  try{
    const {data: sessionData, error: sessionError} = await sb.auth.getSession();
    if(sessionError || !sessionData.session) throw new Error("Your staff session has expired. Log in again.");
    const {data: authData, error: authError} = await sb.auth.signInWithPassword({email:staffEmail, password});
    if(authError || !authData.user || authData.user.id !== sessionData.session.user.id)
      throw new Error("Password verification failed. Check your staff account password and try again.");
    const {data, error} = await sb.rpc("archive_order", {p_order_id:order.id, p_reason:reason});
    if(error) throw new Error("Couldn't delete the order: " + error.message);
    if(!data || data.id !== order.id) throw new Error("This order was already deleted or is no longer available.");
    const index = orders.findIndex(item => item.id === data.id);
    if(index >= 0) orders[index] = data;
    tab = "all";
    $("#deleteDialog").close();
    render();
    toast(`#${order.order_no} removed from active orders; record retained`);
  }catch(error){
    $("#deleteMsg").textContent = error.message || "Couldn't delete the order.";
  }finally{
    button.disabled = false;
    $("#deletePassword").value = "";
  }
});

async function loadPaymentScreenshot(orderId, path){
  if(!$("#paymentScreenshot")) return;
  try{
    const {data, error} = await sb.storage.from("gcash-confirmations").createSignedUrl(path, 300);
    if(selId !== orderId || !$("#paymentScreenshot")) return;
    if(error || !data || !data.signedUrl){
      $("#paymentScreenshot").textContent = "Couldn't load the payment screenshot: " + (error ? error.message : "signed link unavailable");
      return;
    }
    const current = $("#paymentScreenshot");
    current.textContent = "";
    const link = document.createElement("a");
    link.href = data.signedUrl;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Open full-size screenshot";
    const image = document.createElement("img");
    image.src = data.signedUrl;
    image.alt = "Customer GCash payment confirmation";
    image.onerror = () => { current.textContent = "Couldn't display the payment screenshot."; };
    current.append(link, image);
  }catch(error){
    if(selId === orderId && $("#paymentScreenshot"))
      $("#paymentScreenshot").textContent = "Couldn't load the payment screenshot: " + error.message;
  }
}

function setDateRangeToToday(){
  const today = ymdLocal(new Date());
  $("#rangeFrom").value = today;
  $("#rangeTo").value = today;
  const date = new Date(today + "T00:00:00Z");
  calendarYear = date.getUTCFullYear();
  calendarMonth = date.getUTCMonth();
  updateDateRangeButton();
  renderCalendar();
}
let calendarYear, calendarMonth, pendingRangeStart = null;
function formatCalendarDate(value){
  return new Intl.DateTimeFormat("en-PH", {timeZone:"UTC", month:"short", day:"numeric", year:"numeric"})
    .format(new Date(value + "T00:00:00Z"));
}
function updateDateRangeButton(){
  $("#dateRangeBtn").textContent = `${formatCalendarDate($("#rangeFrom").value)} – ${formatCalendarDate($("#rangeTo").value)} ▾`;
}
function renderCalendar(){
  if(!Number.isInteger(calendarYear) || !Number.isInteger(calendarMonth)) return;
  const monthDate = new Date(Date.UTC(calendarYear, calendarMonth, 1));
  $("#calendarMonth").textContent = new Intl.DateTimeFormat("en-PH", {timeZone:"UTC", month:"long", year:"numeric"}).format(monthDate);
  const firstWeekday = monthDate.getUTCDay();
  const daysInMonth = new Date(Date.UTC(calendarYear, calendarMonth + 1, 0)).getUTCDate();
  const start = pendingRangeStart || $("#rangeFrom").value;
  const end = pendingRangeStart ? pendingRangeStart : $("#rangeTo").value;
  const days = [];
  for(let i = 0; i < 42; i++){
    const day = i - firstWeekday + 1;
    if(day < 1 || day > daysInMonth){ days.push('<span class="calendar-empty" aria-hidden="true"></span>'); continue; }
    const value = `${calendarYear}-${String(calendarMonth + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const selected = value === start || value === end;
    const inRange = value > start && value < end;
    const classes = ["calendar-day", selected ? "selected" : "", inRange ? "in-range" : "",
      value === start && value !== end ? "range-start" : "", value === end && value !== start ? "range-end" : ""].filter(Boolean).join(" ");
    days.push(`<button class="${classes}" type="button" role="gridcell" data-date="${value}" aria-label="${formatCalendarDate(value)}"${selected ? ' aria-pressed="true"' : ""}>${day}</button>`);
  }
  $("#calendarDays").innerHTML = days.join("");
  $("#calendarInstruction").textContent = pendingRangeStart ? `Start: ${formatCalendarDate(pendingRangeStart)}. Choose an end date.` : "Choose a start date, then an end date.";
}
function chooseCalendarDate(value){
  if(!pendingRangeStart){
    pendingRangeStart = value;
    renderCalendar();
    return;
  }
  const from = value < pendingRangeStart ? value : pendingRangeStart;
  const to = value < pendingRangeStart ? pendingRangeStart : value;
  $("#rangeFrom").value = from;
  $("#rangeTo").value = to;
  pendingRangeStart = null;
  updateDateRangeButton();
  renderCalendar();
  $("#dateRangeCalendar").hidden = true;
  $("#dateRangeBtn").setAttribute("aria-expanded", "false");
  load();
}
$("#dateRangeBtn").addEventListener("click", () => {
  const calendar = $("#dateRangeCalendar");
  calendar.hidden = !calendar.hidden;
  $("#dateRangeBtn").setAttribute("aria-expanded", String(!calendar.hidden));
});
$("#calendarPrev").addEventListener("click", () => {
  const date = new Date(Date.UTC(calendarYear, calendarMonth - 1, 1));
  calendarYear = date.getUTCFullYear(); calendarMonth = date.getUTCMonth(); renderCalendar();
});
$("#calendarNext").addEventListener("click", () => {
  const date = new Date(Date.UTC(calendarYear, calendarMonth + 1, 1));
  calendarYear = date.getUTCFullYear(); calendarMonth = date.getUTCMonth(); renderCalendar();
});
$("#calendarDays").addEventListener("click", event => {
  const day = event.target.closest(".calendar-day");
  if(day) chooseCalendarDate(day.dataset.date);
});
document.addEventListener("click", event => {
  if(!event.target.closest(".date-range")){
    $("#dateRangeCalendar").hidden = true;
    $("#dateRangeBtn").setAttribute("aria-expanded", "false");
  }
});
$("#dateRangeBtn").addEventListener("keydown", event => {
  if(event.key === "Escape"){
    $("#dateRangeCalendar").hidden = true;
    $("#dateRangeBtn").setAttribute("aria-expanded", "false");
  }
});
setDateRangeToToday();
$("#refresh").onclick = async () => { if(await load()) toast("Up to date"); };
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#detail").classList.contains("open")){ selId = null; render(); } });
setInterval(() => { if(!$("#appView").hidden && !document.activeElement?.closest?.(".detail")) render(); }, 30000); // refresh "x min ago"

/* CSV export of active orders matching the current range, branch, and search */
$("#csv").onclick = () => {
  const rows = filtered();
  if(!rows.length) return toast("Nothing to export");
  const head = ["order_no","ref","date_time","status","mode","branch","order_date","preferred_time","customer_name","customer_phone","customer_email","address","pin_lat","pin_lng","items","subtotal","delivery_fee","total","payment","payment_status","gcash_ref","paid_at","channel","customer_notes","staff_notes"];
  const q = v => { let s = String(v ?? ""); if(/^[=@\t\r]/.test(s)) s = "'" + s;   // stop Excel treating text as a formula
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = rows.map(o => [o.order_no, o.ref, fmtFull.format(new Date(o.created_at)).replace(",", ""), STATUS[o.status]?.label || o.status, orderModeLabel(o.mode), o.branch, o.order_date, o.preferred_time, o.customer_name, o.customer_phone, o.customer_email, o.address, o.delivery_lat, o.delivery_lng,
    o.items.map(i => `${i.qty}x ${i.name}${i.opts && i.opts.length ? ` (${i.opts.join(", ")})` : ""}`).join("; "),
    o.subtotal, o.delivery_fee, o.total, o.payment, PAY[o.payment_status] || o.payment_status, o.payment_ref,
    o.paid_at ? fmtFull.format(new Date(o.paid_at)).replace(",", "") : "", o.channel, o.notes, o.staff_notes].map(q).join(","));
  const blob = new Blob(["﻿" + [head.join(","), ...lines].join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `arbab-kebab-orders-${$("#rangeFrom").value}-to-${$("#rangeTo").value}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* sound for new orders */
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); }catch(e){} }
document.addEventListener("pointerdown", unlockAudio, {once:true});
function beep(){
  if(!soundOn || !audioCtx) return;
  try{
    [0, .22, .44].forEach((t,i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = [880, 1175, 1568][i];
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.35, audioCtx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .2);
      o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .22);
    });
  }catch(e){}
}
function setSoundBtn(){ $("#soundBtn").textContent = soundOn ? "🔔 Sound on" : "🔕 Sound off"; $("#soundBtn").setAttribute("aria-pressed", soundOn); }
$("#soundBtn").onclick = () => { soundOn = !soundOn; ls.set("ak_sound", soundOn ? "on" : "off"); setSoundBtn(); unlockAudio(); if(soundOn) beep(); };

let tt; function toast(t, isNew){ const el = $("#toast"); el.textContent = t; el.className = "toast show" + (isNew ? " new" : ""); clearTimeout(tt); tt = setTimeout(() => el.className = "toast", isNew ? 6000 : 2200); }

boot();
</script>
