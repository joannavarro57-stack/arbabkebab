# Customer order site — Netlify reads this when Base directory = arbab-kebab-site
[build]
  publish = "."
  command = ""
  # only redeploy when something inside this folder changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
