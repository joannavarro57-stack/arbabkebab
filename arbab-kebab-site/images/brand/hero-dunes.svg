<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice">
  <!-- Arbab Kebab hero: desert dunes with a camel caravan on the ridge (decorative) -->
  <defs>
    <symbol id="camel" viewBox="0 0 100 80">
      <path d="M8,40 C10,30 22,26 28,22 C34,12 46,10 52,20 C56,28 60,32 66,30 C70,24 72,16 78,12 C82,9 88,10 92,15 L93,19 C90,21 86,21 84,20 C80,26 76,34 72,42 C70,46 70,50 69,54 L71,78 L67,78 L64,56 L56,56 L57,78 L53,78 L51,56 C44,58 36,58 30,55 L28,78 L24,78 L23,55 C20,56 18,55 17,54 L16,78 L12,78 L13,50 C12,46 10,44 8,40 Z"/>
    </symbol>
    <symbol id="rider" viewBox="0 0 100 80">
      <path d="M8,40 C10,30 22,26 28,22 C34,12 46,10 52,20 C56,28 60,32 66,30 C70,24 72,16 78,12 C82,9 88,10 92,15 L93,19 C90,21 86,21 84,20 C80,26 76,34 72,42 C70,46 70,50 69,54 L71,78 L67,78 L64,56 L56,56 L57,78 L53,78 L51,56 C44,58 36,58 30,55 L28,78 L24,78 L23,55 C20,56 18,55 17,54 L16,78 L12,78 L13,50 C12,46 10,44 8,40 Z"/>
      <path d="M36,16 L37,2 C37,-3 45,-3 45,2 L46,16 Z"/>
      <circle cx="41" cy="-6" r="4"/>
    </symbol>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C46F" stop-opacity="0"/>
      <stop offset="1" stop-color="#F6C46F" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <!-- low sun haze -->
  <rect x="0" y="120" width="1440" height="300" fill="url(#sky)"/>
  <circle cx="860" cy="250" r="70" fill="#F8D27E" opacity=".55"/>

  <!-- far dunes -->
  <path fill="#EBA548" d="M0,300 C140,250 260,236 400,262 C540,288 640,240 780,226 C920,212 1040,250 1160,244 C1280,238 1360,214 1440,220 L1440,420 L0,420 Z"/>

  <!-- middle dune with the caravan on its ridge -->
  <path fill="#DC8A31" d="M0,350 C160,316 300,306 460,316 C600,325 700,286 820,280 C940,274 1060,312 1200,318 C1320,323 1390,306 1440,300 L1440,420 L0,420 Z"/>
  <g fill="#7A4A1E" opacity=".78">
    <use xlink:href="#camel" x="664" y="268" width="34" height="27"/>
    <use xlink:href="#rider" x="702" y="262" width="38" height="30"/>
    <use xlink:href="#camel" x="744" y="256" width="40" height="32"/>
    <use xlink:href="#rider" x="790" y="249" width="44" height="35"/>
    <!-- rope between the camels -->
    <path d="M693,281 Q699,286 706,280 M736,276 Q742,282 748,274 M780,270 Q787,277 794,268" stroke="#7A4A1E" stroke-width="1" fill="none"/>
  </g>

  <!-- front dune, with a wind-swept highlight on its crest -->
  <path fill="#CF7A25" d="M0,392 C200,360 380,352 560,368 C720,382 860,350 1020,342 C1180,334 1320,360 1440,352 L1440,420 L0,420 Z"/>
  <path fill="none" stroke="#E9A04A" stroke-width="2" opacity=".7" d="M560,368 C720,382 860,350 1020,342 C1180,334 1320,360 1440,352"/>
</svg>
